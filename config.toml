baseURL = "https://mindflakes.com/"
languageCode = "en-us"
copyright = "Copyright Nelson Chen"
title = "Nelson Chen's Blog"
theme = "mindflakes-refresh"

metaDataFormat = "yaml"
summaryLength = 200

[pagination]
pagerSize = 10
path = "page"

[author]
name = "Nelson Chen"

[permalinks]
posts = "posts/:year/:month/:day/:slug/"

[params]
searchEngineURL = "https://www.google.com/search"
sidebarHeader = "Hello there!"
description = "Nelson Chen's blog and project notes."

sidebarText = """
This is a site for stuff I write that doesn't fit in 280 characters or simple images.
"""

aiWritingNote = """
A lot of the posts here are AI-written. If your reaction is “ai:dr”, I don't blame you. “I” post this stuff in the hope that humans and agents who find it later won't have to do quite so much work—and that it inspires people to fix annoyances of their own, small or large.
"""

truncate = false

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true


[[menu.main]]
Name = "Blog"
URL = "/"
weight = -10

[[menu.main]]
Name = "Archives"
URL = "/archives/"
weight = -9

[[menu.main]]
Name = "Projects"
URL = "/projects"
weight = -8

